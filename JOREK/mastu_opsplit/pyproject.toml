[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mastu-opsplit"
version = "0.1.0"
description = "Native-mesh MAST-U OpsSplit research study"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "PyYAML", "h5py", "torch"]

[project.optional-dependencies]
analysis = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
